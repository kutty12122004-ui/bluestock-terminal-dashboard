<!-- dashboard/templates/dashboard/upload.py.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bulk Upload Corporate Dataset</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #111827; color: white; padding: 50px; }
        .form-container { max-width: 500px; margin: auto; background: #1f2937; padding: 30px; border-radius: 8px; }
        input[type="file"] { margin: 15px 0; display: block; color: #9ca3af; }
        button { background-color: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Upload Companies Dataset Matrix</h2>
    <p>Select your <strong>dim_company.csv</strong> file to batch-import corporate assets.</p>
    
    <!-- IMPORTANT: method="POST" and enctype="multipart/form-data" are required for files -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Import to Database</button>
    </form>
</div>

</body>
</html>
